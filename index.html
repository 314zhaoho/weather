<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>实时气象 · Live Weather</title>
<style>
  :root{
    --bg:#060b12;
    --panel:rgba(13,22,34,0.55);
    --text:#e6f0fa;
    --text-dim:#7d93a8;
    --text-faint:#3d5266;
    --wind:#8fd8ff;
    --dawn:#e8c47a;
    --danger:#ff7a7a;
    --line:rgba(143,216,255,0.12);
    --mono:"SF Mono","JetBrains Mono","Fira Code",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --serif:Georgia,"Songti SC","Noto Serif SC",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{
    overflow-x:clip;
    max-width:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
  }
  ::selection{background:rgba(143,216,255,0.25);color:#fff;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:rgba(143,216,255,0.15);border-radius:3px;}

  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 70% 50% at 20% 0%, rgba(80,160,220,0.12), transparent 60%),
      radial-gradient(ellipse 60% 40% at 85% 30%, rgba(232,196,122,0.05), transparent 65%);
  }

  #snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:.5;}

  .wrap{position:relative;z-index:3;max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 60px;}

  /* NAV */
  .nav{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:18px 0;margin-bottom:clamp(20px,4vh,40px);
    background:linear-gradient(to bottom, rgba(6,11,18,0.9) 60%, transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--text-faint);
  }
  .brand{display:flex;align-items:center;gap:8px;color:var(--wind);white-space:nowrap;}
  .brand .dot{width:5px;height:5px;border-radius:50%;background:var(--wind);box-shadow:0 0 8px var(--wind);animation:blink 4s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:.3;}50%{opacity:1;}}
  .nav-right{display:flex;gap:clamp(12px,2.5vw,28px);white-space:nowrap;}
  .nav-right .utc{color:var(--dawn);}
  @media (max-width:560px){.nav-right .loc-hide{display:none;}}

  /* STATUS BAR */
  .status{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--text-faint);margin-bottom:clamp(24px,5vh,44px);
  }
  .status .tag{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:100px;
    border:1px solid var(--line);background:rgba(143,216,255,0.04);
  }
  .status .tag.live{color:var(--wind);border-color:rgba(143,216,255,0.3);}
  .status .tag.error{color:var(--danger);border-color:rgba(255,122,122,0.3);}
  .status .tag .mini-dot{width:4px;height:4px;border-radius:50%;background:currentColor;}
  .status .tag.live .mini-dot{animation:blink 3.2s ease-in-out infinite;}

  /* MAIN GRID */
  .dash{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    grid-template-rows:auto auto;
    gap:clamp(16px,2.5vw,24px);
  }
  .card{
    min-width:0;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--panel);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    padding:clamp(18px,3vw,30px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 16px 40px rgba(0,0,0,0.25);
  }

  .card-label{
    display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--text-faint);margin-bottom:clamp(14px,2.5vh,22px);
  }
  .card-label::before{content:"";width:14px;height:1px;background:var(--wind);opacity:.5;}

  /* TEMP CARD */
  .temp-card{grid-column:1;grid-row:1;}
  .temp-main{
    display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;
    font-family:var(--serif);font-size:clamp(4rem,11vw,8rem);line-height:.9;color:var(--text);
  }
  .temp-main .unit{font-family:var(--mono);font-size:.16em;letter-spacing:.1em;color:var(--wind);padding-top:.5em;}
  .temp-sub{
    margin-top:clamp(18px,3vh,28px);
    display:flex;gap:clamp(16px,3vw,32px);flex-wrap:wrap;
  }
  .temp-sub .mini{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--text-dim);}
  .temp-sub .mini strong{display:block;font-family:var(--serif);font-size:clamp(1.1rem,2.2vw,1.6rem);font-weight:400;color:var(--text);margin-top:6px;}

  /* WIND CARD */
  .wind-card{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;}
  .compass-stage{
    position:relative;width:100%;max-width:300px;aspect-ratio:1;
    margin:0 auto clamp(16px,3vh,24px);
  }
  .compass-ring{
    position:absolute;inset:0;border-radius:50%;
    border:1px solid rgba(143,216,255,0.14);
  }
  .compass-ring::after{
    content:"";position:absolute;inset:14%;border-radius:50%;
    border:1px dashed rgba(143,216,255,0.09);
  }
  .tick{
    position:absolute;left:50%;top:50%;width:1px;height:50%;
    background:linear-gradient(to bottom, rgba(143,216,255,0.28), transparent);
    transform-origin:top center;
  }
  .dir-label{
    position:absolute;font-family:var(--mono);font-size:9px;
    letter-spacing:.1em;color:var(--text-faint);text-transform:uppercase;
  }
  .dir-label.n{top:1.5%;left:50%;transform:translateX(-50%);color:var(--wind);}
  .dir-label.e{right:1.5%;top:50%;transform:translateY(-50%);}
  .dir-label.s{bottom:1.5%;left:50%;transform:translateX(-50%);}
  .dir-label.w{left:1.5%;top:50%;transform:translateY(-50%);}

  .arrow-wrap{
    position:absolute;left:50%;top:50%;width:56%;height:56%;
    transform:translate(-50%,-50%) rotate(0deg);
    transition:transform 2s cubic-bezier(.22,1,.36,1);
    will-change:transform;
  }
  .arrow-wrap svg{width:100%;height:100%;display:block;overflow:visible;}
  .arrow-wrap .shaft{stroke:var(--wind);stroke-width:2.2;stroke-linecap:round;}
  .arrow-wrap .head{fill:var(--wind);}
  .arrow-wrap .halo{stroke:rgba(143,216,255,0.2);stroke-width:7;stroke-linecap:round;filter:blur(5px);}
  .center-dot{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:8px;height:8px;border-radius:50%;background:var(--dawn);
    box-shadow:0 0 12px var(--dawn);
  }

  .wind-info{text-align:center;margin-top:auto;}
  .wind-dir-big{
    font-family:var(--serif);font-size:clamp(2rem,4.5vw,3.2rem);
    line-height:1.1;color:var(--text);
  }
  .wind-dir-big .from{color:var(--wind);}
  .wind-meta{
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    color:var(--text-dim);line-height:2;
  }
  .wind-meta strong{color:var(--text);font-weight:500;}

  /* METRICS ROW */
  .metrics{
    grid-column:1;grid-row:2;
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:14px;overflow:hidden;
  }
  .metric{
    background:var(--panel);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    padding:clamp(14px,2.5vw,22px) clamp(12px,2vw,18px);
    min-width:0;
  }
  .metric .k{
    font-family:var(--mono);font-size:9px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--text-faint);
  }
  .metric .v{
    margin-top:8px;font-family:var(--serif);
    font-size:clamp(1.4rem,3.5vw,2.2rem);line-height:1;color:var(--text);
    display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;
  }
  .metric .v .u{font-family:var(--mono);font-size:.35em;letter-spacing:.06em;color:var(--wind);}

  /* VISIBILITY */
  .vis-card{
    grid-column:1 / -1;grid-row:3;
    display:flex;align-items:center;gap:clamp(18px,4vw,40px);flex-wrap:wrap;
  }
  .vis-num{
    font-family:var(--serif);font-size:clamp(2.4rem,6vw,4rem);line-height:1;color:var(--text);
    display:flex;align-items:baseline;gap:6px;flex-shrink:0;
  }
  .vis-num .u{font-family:var(--mono);font-size:.22em;letter-spacing:.08em;color:var(--wind);}
  .vis-bar{flex:1;min-width:140px;height:3px;border-radius:2px;background:rgba(143,216,255,0.1);overflow:hidden;}
  .vis-bar span{display:block;height:100%;width:0%;background:linear-gradient(to right,var(--wind),var(--dawn));transition:width 1.4s cubic-bezier(.22,1,.36,1);}
  .vis-desc{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--text-dim);white-space:nowrap;}

  /* ===== 7 天预报 ===== */
  .forecast-card{
    grid-column:1 / -1;grid-row:4;
    min-width:0;
  }
  .fc-head{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    flex-wrap:wrap;margin-bottom:clamp(14px,2.5vh,22px);
  }
  .fc-head .card-label{margin-bottom:0;}
  .fc-head .fc-hint{
    font-family:var(--mono);font-size:9px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-faint);
  }
  .fc-grid{
    display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
    gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;
  }
  .fc-day{
    min-width:0;background:rgba(9,16,26,0.6);
    padding:clamp(12px,2vw,18px) clamp(8px,1.5vw,14px);
    display:flex;flex-direction:column;gap:10px;
    transition:background .3s ease;
  }
  .fc-day:hover{background:rgba(143,216,255,0.05);}
  .fc-day.today{background:rgba(143,216,255,0.07);}
  .fc-day.today .fc-wd{color:var(--wind);}
  .fc-wd{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--text-dim);
    display:flex;align-items:baseline;justify-content:space-between;gap:4px;
  }
  .fc-wd .fc-date{color:var(--text-faint);font-size:9px;letter-spacing:.08em;}
  .fc-cond{
    font-size:11px;line-height:1.5;color:var(--text-dim);
    min-height:2.9em;
  }
  .fc-temps{
    display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;
    font-family:var(--serif);line-height:1;
  }
  .fc-temps .max{font-size:clamp(1.15rem,2.4vw,1.6rem);color:var(--text);}
  .fc-temps .min{font-size:clamp(.85rem,1.7vw,1.05rem);color:var(--text-faint);}
  .fc-bar{
    position:relative;height:3px;border-radius:2px;
    background:rgba(143,216,255,0.1);overflow:hidden;margin-top:auto;
  }
  .fc-bar span{
    position:absolute;top:0;height:100%;border-radius:2px;
    background:linear-gradient(to right,var(--wind),var(--dawn));
    transition:left 1s cubic-bezier(.22,1,.36,1),width 1s cubic-bezier(.22,1,.36,1);
  }
  .fc-pop{
    font-family:var(--mono);font-size:9px;letter-spacing:.08em;
    color:var(--wind);min-height:1.2em;
  }
  .fc-pop.empty{color:transparent;}

  /* FOOTER */
  .foot{
    margin-top:clamp(32px,6vh,56px);
    padding-top:20px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-family:var(--mono);font-size:9px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-faint);
  }

  .loading .v, .loading .temp-main, .loading .wind-dir-big{opacity:.25;}
  .loading .vis-bar span{width:0 !important;}

  /* RESPONSIVE */
  @media (max-width:820px){
    .dash{grid-template-columns:1fr;grid-template-rows:auto;}
    .temp-card,.wind-card,.metrics,.vis-card,.forecast-card{grid-column:1;grid-row:auto;}
    .wind-card{flex-direction:row;align-items:center;gap:20px;flex-wrap:wrap;}
    .compass-stage{max-width:220px;margin:0;}
    .wind-info{text-align:left;flex:1;min-width:160px;}
    .metrics{grid-template-columns:repeat(2,minmax(0,1fr));}
    .fc-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .fc-cond{min-height:0;}
  }
  @media (max-width:480px){
    .wind-card{flex-direction:column;align-items:stretch;}
    .compass-stage{max-width:200px;margin:0 auto;}
    .wind-info{text-align:center;}
    .vis-card{flex-direction:column;align-items:flex-start;gap:12px;}
    .vis-bar{width:100%;}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

<canvas id="snow" aria-hidden="true"></canvas>

<div class="wrap">

  <nav class="nav">
    <span class="brand"><span class="dot"></span> LIVE WEATHER</span>
    <div class="nav-right">
      <span class="loc-hide" id="coords">--°N / --°E</span>
      <span class="utc" id="utc">--:--:-- UTC</span>
    </div>
  </nav>

  <div class="status" id="status">
    <span class="tag live" id="statusTag"><span class="mini-dot"></span> <span id="statusText">定位中…</span></span>
    <span id="updateTime">上次更新 —</span>
  </div>

  <main class="dash" id="dash">

    <!-- 温度 -->
    <section class="card temp-card">
      <div class="card-label">气温 / Temperature</div>
      <div class="temp-main">
        <span id="temp">--</span><span class="unit">°C</span>
      </div>
      <div class="temp-sub">
        <div class="mini">体感<strong id="feels">--°</strong></div>
        <div class="mini">天气<strong id="condition">--</strong></div>
        <div class="mini">云量<strong id="cloud">--%</strong></div>
      </div>
    </section>

    <!-- 风向罗盘 -->
    <section class="card wind-card">
      <div class="card-label">风向 / Wind</div>
      <div class="compass-stage">
        <div class="compass-ring"></div>
        <div class="tick" style="transform:rotate(0deg)"></div>
        <div class="tick" style="transform:rotate(45deg)"></div>
        <div class="tick" style="transform:rotate(90deg)"></div>
        <div class="tick" style="transform:rotate(135deg)"></div>
        <div class="tick" style="transform:rotate(180deg)"></div>
        <div class="tick" style="transform:rotate(225deg)"></div>
        <div class="tick" style="transform:rotate(270deg)"></div>
        <div class="tick" style="transform:rotate(315deg)"></div>
        <span class="dir-label n">N</span>
        <span class="dir-label e">E</span>
        <span class="dir-label s">S</span>
        <span class="dir-label w">W</span>
        <div class="arrow-wrap" id="arrow">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <line class="halo" x1="50" y1="82" x2="50" y2="22"/>
            <line class="shaft" x1="50" y1="78" x2="50" y2="24"/>
            <polygon class="head" points="50,10 42,30 58,30"/>
          </svg>
        </div>
        <div class="center-dot"></div>
      </div>
      <div class="wind-info">
        <div class="wind-dir-big">风从 <span class="from" id="dirName">--</span> 来</div>
        <div class="wind-meta">
          风速 <strong id="windSpeed">-- km/h</strong><br>
          阵风 <strong id="gust">-- km/h</strong><br>
          方位角 <strong id="dirDeg">--°</strong>
        </div>
      </div>
    </section>

    <!-- 指标行 -->
    <section class="metrics">
      <div class="metric">
        <div class="k">湿度</div>
        <div class="v"><span id="humidity">--</span><span class="u">%</span></div>
      </div>
      <div class="metric">
        <div class="k">气压</div>
        <div class="v"><span id="pressure">--</span><span class="u">hPa</span></div>
      </div>
      <div class="metric">
        <div class="k">降水</div>
        <div class="v"><span id="precip">--</span><span class="u">mm</span></div>
      </div>
      <div class="metric">
        <div class="k">露点</div>
        <div class="v"><span id="dew">--</span><span class="u">°C</span></div>
      </div>
    </section>

    <!-- 能见度 -->
    <section class="card vis-card">
      <div class="card-label" style="margin-bottom:0;">能见度 / Visibility</div>
      <div class="vis-num"><span id="visVal">--</span><span class="u">km</span></div>
      <div class="vis-bar"><span id="visBar"></span></div>
      <div class="vis-desc" id="visDesc">等待数据</div>
    </section>

    <!-- 7 天预报 -->
    <section class="card forecast-card">
      <div class="fc-head">
        <div class="card-label">未来一周 / 7-Day Forecast</div>
        <span class="fc-hint">条形为全周温度区间</span>
      </div>
      <div class="fc-grid" id="fcGrid">
        <!-- JS 渲染 -->
      </div>
    </section>

  </main>

  <footer class="foot">
    <span>Open-Meteo / Live Dashboard</span>
    <span id="locName">位置 —</span>
    <span>更新间隔 10 min</span>
  </footer>

</div>

<script>
/* ========== 雪花背景 ========== */
(function(){
  const canvas = document.getElementById('snow');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;
  const flakes = [];
  const COUNT = 70;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width  = innerWidth * dpr;
    H = canvas.height = innerHeight * dpr;
    canvas.style.width  = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  function init(){
    flakes.length = 0;
    for(let i=0;i<COUNT;i++){
      flakes.push({
        x: Math.random()*W, y: Math.random()*H,
        r: (0.5 + Math.random()*1.4)*dpr,
        vy: (0.12 + Math.random()*0.28)*dpr,
        vx: (Math.random()-.5)*0.15*dpr,
        sway: Math.random()*Math.PI*2,
        swaySpeed: 0.004 + Math.random()*0.01,
        opacity: 0.1 + Math.random()*0.35
      });
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const f of flakes){
      f.y += f.vy; f.sway += f.swaySpeed;
      f.x += f.vx + Math.sin(f.sway)*0.2*dpr;
      if(f.y > H+10){ f.y=-10; f.x=Math.random()*W; }
      if(f.x < -10) f.x=W+10;
      if(f.x > W+10) f.x=-10;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(200,235,255,${f.opacity*(0.7+Math.sin(f.sway*1.5)*0.3)})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  resize(); init(); draw();
  addEventListener('resize', () => { resize(); init(); });
})();

/* ========== UTC 时钟 ========== */
(function(){
  const el = document.getElementById('utc');
  function tick(){ el.textContent = new Date().toISOString().slice(11,19) + ' UTC'; }
  tick(); setInterval(tick, 1000);
})();

/* ========== 实时天气 ========== */
const $ = id => document.getElementById(id);

const DIRS_16 = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const WEEK_CN = ["周日","周一","周二","周三","周四","周五","周六"];

function weatherText(code){
  const map = {
    0:'晴',1:'大部晴朗',2:'多云',3:'阴',
    45:'雾',48:'霜雾',
    51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',
    61:'小雨',63:'中雨',65:'大雨',
    71:'小雪',73:'中雪',75:'大雪',
    80:'小阵雨',81:'阵雨',82:'强阵雨',
    85:'小阵雪',86:'大阵雪',
    95:'雷暴',96:'雷暴伴小冰雹',99:'雷暴伴大冰雹'
  };
  return map[code] ?? ('天气码 ' + code);
}

function visText(meters){
  const km = meters/1000;
  if(km >= 20) return '极佳 / Excellent';
  if(km >= 10) return '良好 / Good';
  if(km >= 4)  return '一般 / Moderate';
  if(km >= 1)  return '较差 / Poor';
  return '极差 / Very poor';
}

function setLoading(on){
  $('dash').classList.toggle('loading', on);
}

/* 渲染 7 天预报 */
function renderForecast(daily){
  const grid = $('fcGrid');
  if(!daily || !daily.time || !daily.time.length){
    grid.innerHTML = '';
    return;
  }

  const days  = daily.time;
  const maxs  = daily.temperature_2m_max;
  const mins  = daily.temperature_2m_min;
  const codes = daily.weather_code;
  const pops  = daily.precipitation_probability_max || [];

  // 全周温度范围，用于计算条形相对位置
  const weekMax = Math.max(...maxs);
  const weekMin = Math.min(...mins);
  const span = Math.max(weekMax - weekMin, 1);

  const todayStr = new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD 本地时区

  let html = '';
  days.forEach((d, i) => {
    const date = new Date(d + 'T00:00:00');
    const isToday = d === todayStr;
    const wd = isToday ? '今天' : WEEK_CN[date.getDay()];
    const dateLabel = `${date.getMonth()+1}/${date.getDate()}`;

    const mx = Math.round(maxs[i]);
    const mn = Math.round(mins[i]);

    const left = ((mins[i] - weekMin) / span) * 100;
    const width = Math.max(((maxs[i] - mins[i]) / span) * 100, 6);

    const pop = pops[i];
    const popText = (pop !== undefined && pop !== null && pop > 0)
      ? `降水 ${Math.round(pop)}%` : '';
    const popClass = popText ? 'fc-pop' : 'fc-pop empty';

    html += `
      <div class="fc-day${isToday ? ' today' : ''}">
        <div class="fc-wd"><span>${wd}</span><span class="fc-date">${dateLabel}</span></div>
        <div class="fc-cond">${weatherText(codes[i])}</div>
        <div class="fc-temps"><span class="max">${mx}°</span><span class="min">${mn}°</span></div>
        <div class="fc-bar"><span style="left:${left.toFixed(1)}%;width:${width.toFixed(1)}%"></span></div>
        <div class="${popClass}">${popText || '—'}</div>
      </div>
    `;
  });

  grid.innerHTML = html;
}

async function fetchWeather(lat, lon, label){
  const url = 'https://api.open-meteo.com/v1/forecast';
  const params = new URLSearchParams({
    latitude: lat,
    longitude: lon,
    current: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
    hourly: 'visibility,dew_point_2m',
    daily: 'temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max',
    forecast_days: '7',
    timezone: 'auto',
    wind_speed_unit: 'kmh',
    temperature_unit: 'celsius'
  });

  const res = await fetch(url + '?' + params.toString());
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const c = data.current;
  if(!c) throw new Error('no current block');

  // visibility 和 dew_point_2m 属于 hourly 字段，需要从 hourly 数组匹配当前小时
  const hTimes = (data.hourly && data.hourly.time) || [];
  const hVis   = (data.hourly && data.hourly.visibility) || [];
  const hDew   = (data.hourly && data.hourly.dew_point_2m) || [];
  const curHour = (c.time || '').slice(0, 13); // "YYYY-MM-DDTHH"
  let visM = 0, dewVal = 0;
  for (let i = 0; i < hTimes.length; i++) {
    if ((hTimes[i] || '').slice(0, 13) === curHour) {
      visM  = hVis[i]  ?? 0;
      dewVal = hDew[i] ?? 0;
      break;
    }
  }

  // 温度
  $('temp').textContent = Math.round(c.temperature_2m);
  $('feels').textContent = Math.round(c.apparent_temperature) + '°';
  $('condition').textContent = weatherText(c.weather_code);
  $('cloud').textContent = Math.round(c.cloud_cover) + '%';

  // 指标
  $('humidity').textContent = Math.round(c.relative_humidity_2m);
  $('pressure').textContent = Math.round(c.pressure_msl);
  $('precip').textContent = (c.precipitation ?? 0).toFixed(1);
  $('dew').textContent = Math.round(dewVal);

  // 风
  const deg = c.wind_direction_10m ?? 0;
  const idx = Math.round(deg / 22.5) % 16;
  $('dirName').textContent = DIRS_16[idx];
  $('dirDeg').textContent = Math.round(deg) + '°';
  $('windSpeed').textContent = (c.wind_speed_10m ?? 0).toFixed(1) + ' km/h';
  $('gust').textContent = (c.wind_gusts_10m ?? 0).toFixed(1) + ' km/h';
  $('arrow').style.transform = `translate(-50%,-50%) rotate(${(deg + 180) % 360}deg)`;

  // 能见度
  const visKm = visM / 1000;
  $('visVal').textContent = visKm.toFixed(1);
  $('visDesc').textContent = visText(visM);
  $('visBar').style.width = Math.max(4, Math.min(100, (visKm / 20) * 100)) + '%';

  // 7 天预报
  renderForecast(data.daily);

  // 状态
  const t = new Date();
  $('updateTime').textContent = '上次更新 ' + t.toLocaleTimeString('zh-CN', {hour12:false});
  $('statusTag').className = 'tag live';
  $('statusText').textContent = '实时';
  $('locName').textContent = label;
  $('coords').textContent = `${lat.toFixed(2)}° / ${lon.toFixed(2)}°`;
}

async function resolveLocation(){
  return new Promise((resolve) => {
    if(!navigator.geolocation){
      resolve({ lat: 43.88, lon: 125.32, label: '默认 · 长春' });
      return;
    }
    let done = false;
    const timer = setTimeout(() => {
      if(!done){ done = true; resolve({ lat: 43.88, lon: 125.32, label: '默认 · 长春（定位超时）' }); }
    }, 8000);

    navigator.geolocation.getCurrentPosition(
      pos => {
        if(done) return; done = true; clearTimeout(timer);
        resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, label: '当前位置' });
      },
      () => {
        if(done) return; done = true; clearTimeout(timer);
        resolve({ lat: 43.88, lon: 125.32, label: '默认 · 长春（定位被拒）' });
      },
      { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 }
    );
  });
}

async function boot(){
  setLoading(true);
  const loc = await resolveLocation();
  try{
    await fetchWeather(loc.lat, loc.lon, loc.label);
  }catch(err){
    console.error(err);
    $('statusTag').className = 'tag error';
    $('statusText').textContent = '获取失败';
    $('updateTime').textContent = '请检查网络后刷新';
    setLoading(false);
    return;
  }
  setLoading(false);
}

boot();
setInterval(async () => {
  try{
    const loc = await resolveLocation();
    await fetchWeather(loc.lat, loc.lon, loc.label);
  }catch(e){ /* 静默失败 */ }
}, 600000);
</script>
